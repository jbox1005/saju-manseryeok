<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/saju-manseryeok/icon-app.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>사주랩</title>

    <!-- PWA -->
    <link rel="manifest" href="/saju-manseryeok/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <!-- 표준 이름. 애플 전용 태그만으로는 최신 iOS가 못 알아듣는 경우가 있다. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- ⚠ black-translucent를 쓰면 안 된다. 화면이 상태표시줄 밑까지 이어지는 대신,
         iOS가 그 자리에 **검정을 57% 덮어씌운다**(실측: #ff0033 → rgb(109,11,31)).
         무슨 색을 칠하든 그 위에 검은 막이 한 겹 올라가므로, 우리 색을 아무리
         맞춰도 소용이 없다 — 「상단 검은 그림자」로 세 번 신고받은 것의 정체다.
         시계·배터리를 어떤 배경에서도 읽히게 하려는 iOS의 처리라 끌 수 없다.
         타로랩에도 같은 증상이 있었다(두 앱 다 black-translucent였다).
         black이면 iOS가 상태표시줄을 제 불투명 막대로 그리고 우리 화면은 그
         아래에서 시작한다 — 덮어씌울 콘텐츠가 없으니 막도 없다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="사주랩" />
    <link rel="apple-touch-icon" href="/saju-manseryeok/icon-app.png" />

    <!-- 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/saju-manseryeok/assets/index-D9RVTKQs.js"></script>
    <link rel="stylesheet" crossorigin href="/saju-manseryeok/assets/index-iwQqkEt6.css">
  </head>
  <body>
    <script>
      // 번들이 오기 전에 걸어 둔다. 어두운 쪽 한 벌뿐이라 고를 것이 없다.
      // CSS도 :root가 이미 어두우므로 이 줄은 [data-theme="dark"]를 보는
      // 바깥 규칙들을 위한 것이다.
      document.documentElement.setAttribute('data-theme', 'dark');
    </script>
    <!-- ── 로딩 화면 ──
         React가 오기 전에 먼저 뜬다. 그래서 여기(index.html)에 있다 —
         번들 안에 두면 정작 기다리는 동안은 빈 화면이다.
         ⚠ 현관의 태그라인과 인사를 여기로 옮겼다(2026-09-21). 켤 때 한 번
            읽히면 되는 말이라 문간에 늘 세워 둘 까닭이 없었고, 그 자리는
            갈도사가 설 자리로 쓴다. 형제 앱 오늘한끼의 스플래시와 같은 결이다. -->
    <div class="sp" id="sp" aria-hidden="true">
      <div class="sp-in">
        <img src="/saju-manseryeok/icon-app.png" alt="" />
        <p class="sp-t">여덟 글자에 담긴<br />인연의 별자리</p>
        <span class="sp-line"></span>
      </div>
    </div>
    <style>
      .sp {
        position: fixed; inset: 0; z-index: 100;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 42%, #1b1830 0%, #121212 68%);
        transition: opacity .55s ease, visibility .55s;
      }
      .sp.hide { opacity: 0; visibility: hidden; pointer-events: none; }
      .sp-in { display: flex; flex-direction: column; align-items: center; gap: 18px;
               animation: sp-in .9s ease both; }
      .sp-in img { height: min(30vh, 188px); width: auto; border-radius: 26px;
                   box-shadow: 0 14px 40px rgba(0, 0, 0, .55); }
      .sp-t { margin: 0; text-align: center; line-height: 1.6;
              font-family: "Gowun Batang", serif; font-size: 17px;
              letter-spacing: .04em; color: #b9b0a0; }
      .sp-line { width: 0; height: 2px; background: #C8A44A; animation: sp-line 1.5s ease .35s both; }
      @keyframes sp-in { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes sp-line { from { width: 0; } to { width: 44px; } }
      @media (prefers-reduced-motion: reduce) {
        .sp-in, .sp-line { animation: none; } .sp { transition: none; } .sp-line { width: 44px; }
      }
    </style>
    <script>
      /* 로고를 충분히 보여 주고 걷는다. 어지러운 분께는 스치듯 지나간다.
         ⚠ DOM에서 아주 빼 버린다 — position: fixed로 남겨 두면 iOS 웹킷에서
            영구 GPU 겹이 되어 앱을 쓰는 내내 합성 비용을 문다. */
      (function () {
        var sp = document.getElementById('sp');
        if (!sp) return;
        var quick = matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(function () {
          sp.classList.add('hide');
          setTimeout(function () { sp.remove(); }, 700);
        }, quick ? 300 : 1500);
      })();
    </script>

    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/saju-manseryeok/sw.js');
        });
      }
    </script>
  </body>
</html>
