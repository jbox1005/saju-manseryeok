<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<!-- 앱과 **똑같은** 조건으로 맞춘다. 하나라도 다르면 진단이 무의미하다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<title>노치 진단 B</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #121212; color: #e0e0e0;
               font: 13px/1.6 -apple-system, system-ui, sans-serif; }
  /* 앱의 body::before와 같은 것 — 노치 자리를 덮는다 */
  .cover { position: fixed; top: 0; left: 0; right: 0;
           height: env(safe-area-inset-top, 0px); background: #121212; z-index: 100000; }
  .band { height: 26px; display: flex; align-items: center; padding-left: 10px;
          font-size: 11px; letter-spacing: .04em; }
  .wrap { padding-top: env(safe-area-inset-top, 0px); }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { padding: 5px 8px; border-bottom: 1px solid #2a2a2a; vertical-align: top; }
  td:first-child { color: #9aa0a6; white-space: nowrap; width: 42%; }
  b { color: #ffd479; }
  h1 { font-size: 15px; margin: 12px 10px 6px; color: #ffd479; }
  p { margin: 6px 10px; color: #9aa0a6; font-size: 12px; }
</style>
</head>
<body>
<div class="cover"></div>
<div class="wrap">
  <!-- 견본 띠 — 화면 맨 위 색이 이 중 어느 것과 같은지 눈으로 맞춰 본다 -->
  <div class="band" style="background:#121212">#121212 — 앱의 머리글·노치 색 (B: status-bar=black)</div>
  <div class="band" style="background:#000000">#000000 — 순수 검정</div>
  <div class="band" style="background:#0b0d14">#0b0d14 — 우주 한복판</div>
  <div class="band" style="background:#04050a">#04050a — 우주 가장자리</div>

  <h1>이 기기가 말하는 것</h1>
  <table id="t"></table>
  <p>이 화면을 그대로 스크린샷 찍어 주세요. 맨 위 띠와 위 견본을 픽셀로 견줍니다.</p>
</div>
<script>
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;height:env(safe-area-inset-top,0px);width:1px;';
  document.body.appendChild(probe);
  var mode = ['standalone', 'fullscreen', 'minimal-ui', 'browser']
    .find(function (m) { return matchMedia('(display-mode: ' + m + ')').matches; }) || '알 수 없음';
  var rows = [
    ['safe-area-inset-top', getComputedStyle(probe).height + '  ← 0px면 노치 자리를 아예 안 준다는 뜻'],
    ['실행 방식 (display-mode)', mode],
    ['navigator.standalone', String(window.navigator.standalone)],
    ['화면 크기', window.innerWidth + ' × ' + window.innerHeight + '  (dpr ' + window.devicePixelRatio + ')'],
    ['screen', window.screen.width + ' × ' + window.screen.height],
    ['visualViewport', window.visualViewport
      ? Math.round(window.visualViewport.width) + ' × ' + Math.round(window.visualViewport.height)
        + '  offsetTop ' + Math.round(window.visualViewport.offsetTop) : '없음'],
    ['userAgent', navigator.userAgent],
  ];
  document.getElementById('t').innerHTML = rows.map(function (r) {
    return '<tr><td>' + r[0] + '</td><td><b>' + r[1] + '</b></td></tr>';
  }).join('');
</script>
</body>
</html>
