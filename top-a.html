<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#121212" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<!-- ▼ 여기만 다르다 (A = 지금 앱과 같은 설정) -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="A 지금" />
<title>A — 지금 (black-translucent)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #121212;
               color: #e0e0e0; font: 14px/1.6 -apple-system, system-ui, sans-serif;
               -webkit-user-select: none; user-select: none; }
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* 앱의 .relmap-top과 같은 구조 — 노치만큼 padding을 더 준다 */
  .top {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    padding-top: calc(8px + env(safe-area-inset-top, 0px));
    background: #121212;
    border-bottom: 1px solid #2a2a2a;
    flex: 0 0 auto;
  }
  .btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #333;
         background: #1a1a1a; color: #cfcfcf; display: flex;
         align-items: center; justify-content: center; font-size: 15px; }
  .title { flex: 1; font-size: 17px; font-weight: 700; margin: 0; }

  /* 앱의 우주 배경과 같은 결 */
  .body { flex: 1; position: relative; overflow: hidden;
    background:
      radial-gradient(46% 34% at 28% 30%, rgba(72,96,160,.16), transparent 70%),
      radial-gradient(42% 44% at 74% 68%, rgba(96,125,139,.13), transparent 72%),
      radial-gradient(circle at 50% 42%, #0b0d14, #04050a 78%);
  }
  .card { margin: 16px 14px; padding: 14px; border-radius: 12px;
          border: 1px solid #2f2a1e; background: rgba(255,212,121,.05); }
  h2 { margin: 0 0 8px; font-size: 15px; color: #ffd479; }
  p { margin: 6px 0; font-size: 13px; color: #b8b8b8; }
  b { color: #ffd479; }
  .big { font-size: 34px; font-weight: 800; color: #ffd479; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div class="btn">⌂</div>
    <div class="btn">‹</div>
    <h1 class="title">인연관계도</h1>
    <div class="btn">?</div>
    <div class="btn">⚙</div>
  </header>
  <main class="body">
    <div class="card">
      <div class="big">A · 지금</div>
      <h2>status-bar-style = black-translucent</h2>
      <p>화면이 <b>상태표시줄 밑까지 이어집니다.</b> 시계·배터리가 우리 머리글 위에 겹쳐 놓입니다.</p>
      <p>대신 iOS가 그 자리에 <b>검정을 57% 덮습니다.</b> 그래서 머리글 위쪽이 아래보다 어둡게 보입니다 — 그것이 「상단 검은 그림자」입니다.</p>
      <p>머리글의 <b>회색 테두리 단추</b>가 노치 쪽에서 더 어둡게 보이는지 견줘 보세요.</p>
    </div>
  </main>
</div>
</body>
</html>
